# 推送到 main 時自動部署：資料庫 migration → 後台函式 → 網站。
# 需要的 GitHub 設定（Settings → Secrets and variables → Actions），見 docs/HANDOVER.md「自動部署」。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同一時間只跑一個部署，後面的排隊，不取消進行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # 刻意不設 SUPABASE_DB_PASSWORD：CLI 一看到它就改走資料庫 IPv6 直連，GitHub runner 連不到
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 前端測試與型別檢查
        run: |
          npx vitest --run
          npx tsc -b

      - name: 連結 Supabase 專案
        run: |
          npx supabase link --project-ref "$PROJECT_REF"
          # GitHub runner 沒有 IPv6，改用 Supabase 的 IPv4 Session pooler（位址不含密碼，
          # 密碼由 CLI 透過 access token 建立的臨時登入角色處理）。
          # 位址來源：Dashboard → Connect → Session pooler；換地區或換專案時要一起改。
          mkdir -p supabase/.temp
          echo "postgresql://postgres.${PROJECT_REF}@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres" > supabase/.temp/pooler-url

      - name: 推送資料庫更新
        # 不帶 --password：讓 CLI 用 access token 走 Supabase 的登入通道（GitHub runner 連不到資料庫的 IPv6 直連位址）
        run: npx supabase db push --remote --yes

      - name: 部署後台函式
        run: |
          npx supabase functions deploy notify-email --remote="$PROJECT_REF" --yes
          npx supabase functions deploy admin-members --remote="$PROJECT_REF" --yes

      - name: 打包網站
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 部署網站到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
